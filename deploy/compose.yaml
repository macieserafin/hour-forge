# Production stack: Caddy (TLS) -> frontend (static files) and backend (/api) -> PostgreSQL.
# Run from this directory with a filled-in .env and backend.env (copy the .example files):
#   docker compose build      # or pull the images once CI publishes them
#   docker compose up -d
# Only Caddy publishes ports. The database is reachable only from the backend, on a network without internet access.
name: ${COMPOSE_PROJECT_NAME:-hourforge}

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  caddy:
    <<: *hardening
    image: caddy:2.10-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      HOURFORGE_DOMAIN: ${HOURFORGE_DOMAIN:?Set HOURFORGE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [edge]
    mem_limit: ${CADDY_MEMORY:-128m}
    cpus: ${CADDY_CPUS:-0.5}

  frontend:
    <<: *hardening
    image: ${FRONTEND_IMAGE:-hourforge-frontend:local}
    build: ../frontend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [edge]
    mem_limit: ${FRONTEND_MEMORY:-64m}
    cpus: ${FRONTEND_CPUS:-0.5}

  backend:
    <<: *hardening
    image: ${BACKEND_IMAGE:-hourforge-backend:local}
    build: ../backend
    # One instance only: background jobs assume a single running backend (several replicas: path B8).
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    # Application settings (mail, sign-in providers, keys). Kept apart from .env so the backend never sees the
    # database administrator password.
    env_file: backend.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-hourforge}
      DB_USERNAME: ${DB_USERNAME:-hourforge}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      FRONTEND_URL: https://${HOURFORGE_DOMAIN}
      SESSION_COOKIE_SECURE: "true"
      # Client addresses (rate limits, sign-in history) come from Caddy's X-Forwarded-For. Tomcat trusts it only from
      # private addresses, i.e. from Caddy on the Docker network; nothing else can reach the backend.
      SERVER_FORWARD_HEADERS_STRATEGY: native
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [edge, data]
    mem_limit: ${BACKEND_MEMORY:-1g}
    cpus: ${BACKEND_CPUS:-1.5}

  postgres:
    <<: *hardening
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-hourforge}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 128m
    networks: [data]
    mem_limit: ${POSTGRES_MEMORY:-512m}
    cpus: ${POSTGRES_CPUS:-1}

  # Creates or updates the application's database account, then exits.
  postgres-init:
    image: postgres:18-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ${DB_NAME:-hourforge}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_USERNAME: ${DB_USERNAME:-hourforge}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - ../backend/docker/postgres/01-create-app-user.sh:/create-app-user.sh:ro
    entrypoint: ["/bin/sh", "/create-app-user.sh"]
    networks: [data]

networks:
  # Caddy, frontend and backend; the backend reaches the internet from here (SMTP, Google, Jira, Turnstile).
  edge: {}
  # Backend and database only, without a route to the internet.
  data:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
