# Production stack: Caddy (TLS) -> frontend (static files) and backend (/api) -> PostgreSQL.
# Run from this directory with a filled-in .env and backend.env (copy the .example files):
#   docker compose build      # or pull the images once CI publishes them
#   docker compose up -d
# Only Caddy publishes ports. The database is reachable only from the backend, on a network without internet access.
name: ${COMPOSE_PROJECT_NAME:-hourforge}

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  caddy:
    <<: *hardening
    image: caddy:2.11-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      HOURFORGE_DOMAIN: ${HOURFORGE_DOMAIN:?Set HOURFORGE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [edge]
    mem_limit: ${CADDY_MEMORY:-128m}
    cpus: ${CADDY_CPUS:-0.5}

  frontend:
    <<: *hardening
    image: ${FRONTEND_IMAGE:-hourforge-frontend:local}
    build: ../frontend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [edge]
    mem_limit: ${FRONTEND_MEMORY:-64m}
    cpus: ${FRONTEND_CPUS:-0.5}

  backend:
    <<: *hardening
    image: ${BACKEND_IMAGE:-hourforge-backend:local}
    build: ../backend
    # One instance only: background jobs assume a single running backend (several replicas: path B8).
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Application settings (mail, sign-in providers, keys). Kept apart from .env so the backend never sees the
    # database administrator password.
    env_file: backend.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-hourforge}
      DB_USERNAME: ${DB_USERNAME:-hourforge}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      FRONTEND_URL: https://${HOURFORGE_DOMAIN}
      # Secure session cookie, trusting X-Forwarded-For only from Caddy, and a statement timeout in the database
      # (backend/src/main/resources/application-prod.properties).
      SPRING_PROFILES_ACTIVE: prod
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [edge, data]
    mem_limit: ${BACKEND_MEMORY:-1g}
    cpus: ${BACKEND_CPUS:-1.5}

  # Applies the database migrations with the account that owns the schema, then exits. The backend starts after it and
  # signs in with an account that cannot change the schema.
  migrate:
    image: ${BACKEND_IMAGE:-hourforge-backend:local}
    build: ../backend
    restart: "no"
    command: ["migrate"]
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-hourforge}
      MIGRATION_DB_USERNAME: ${MIGRATION_DB_USERNAME:-hourforge_migrator}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [data]
    mem_limit: ${MIGRATE_MEMORY:-512m}

  postgres:
    <<: *hardening
    image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_DB: ${DB_NAME:-hourforge}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 128m
    networks: [data]
    mem_limit: ${POSTGRES_MEMORY:-512m}
    cpus: ${POSTGRES_CPUS:-1}

  # Creates or updates the database accounts (migration and application), then exits.
  postgres-init:
    image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ${DB_NAME:-hourforge}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_USERNAME: ${DB_USERNAME:-hourforge}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MIGRATION_DB_USERNAME: ${MIGRATION_DB_USERNAME:-hourforge_migrator}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}
    volumes:
      - ../backend/docker/postgres/01-create-app-user.sh:/create-app-user.sh:ro
    entrypoint: ["/bin/sh", "/create-app-user.sh"]
    networks: [data]

  # Encrypted database backups every 6 hours into a restic repository (local volume by default; another server or object
  # storage through BACKUP_REPOSITORY). Restore and restore test: docs/operations/restore.md.
  backup:
    <<: *hardening
    image: ${BACKUP_IMAGE:-hourforge-backup:local}
    build: ./backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-hourforge}
      # The migration account owns every table, so it can read all of them.
      PGUSER: ${MIGRATION_DB_USERNAME:-hourforge_migrator}
      PGPASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}
      RESTIC_REPOSITORY: ${BACKUP_REPOSITORY:-/repository}
      RESTIC_PASSWORD: ${BACKUP_PASSWORD:?Set BACKUP_PASSWORD in .env}
      RESTIC_CACHE_DIR: /scratch/cache
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      # For an S3-compatible repository (s3:https://...): the provider's keys.
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - backup_repository:/repository
      - backup_scratch:/scratch
      - backup_status:/status
    cap_drop: [ALL]
    # data: the database; edge: an off-site repository on the internet.
    networks: [data, edge]
    mem_limit: ${BACKUP_MEMORY:-512m}
    cpus: ${BACKUP_CPUS:-0.5}

  # Optional monitoring ("docker compose --profile monitoring up -d"): metrics, alert rules and e-mail alerts.
  # Needs monitoring/alertmanager.yml (copy the .example). The web pages listen on this server only (SSH tunnel).
  prometheus:
    <<: *hardening
    profiles: [monitoring]
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    read_only: true
    cap_drop: [ALL]
    networks: [edge]
    mem_limit: ${PROMETHEUS_MEMORY:-256m}

  alertmanager:
    <<: *hardening
    profiles: [monitoring]
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    read_only: true
    cap_drop: [ALL]
    networks: [edge]
    mem_limit: 64m

  node-exporter:
    <<: *hardening
    profiles: [monitoring]
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/backup-status
    volumes:
      - /:/host:ro,rslave
      - backup_status:/backup-status:ro
    pid: host
    read_only: true
    cap_drop: [ALL]
    networks: [edge]
    mem_limit: 64m

networks:
  # Caddy, frontend and backend; the backend reaches the internet from here (SMTP, Google, Jira, Turnstile).
  edge: {}
  # Backend and database only, without a route to the internet.
  data:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backup_repository:
  backup_scratch:
  backup_status:
  prometheus_data:
  alertmanager_data:
