# Prometheus of the optional "monitoring" profile: scrapes the backend's management port and node-exporter, evaluates
# alerts.yml and sends firing alerts to Alertmanager. Nothing here is reachable from outside the server.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:9090"]
  # Host disk, memory and CPU, plus the backup status file written by the backup service (textfile collector).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
