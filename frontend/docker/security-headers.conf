# Included in every location: nginx drops server-level add_header lines once a location has its own.
# Cloudflare Turnstile (registration bot check, optional) needs its script and frame from challenges.cloudflare.com.
# img-src: blob: for the picture editor preview, data: for small images Vite inlines into the build.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
# Invitation and reset links carry a token in the address; it must not leak to other sites.
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
