# Static server for the built frontend. The reverse proxy in front of it sends /api to the backend,
# terminates TLS and sets HSTS; this server only serves files and their security headers.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # API requests reaching this server were routed wrongly; never answer them with the app page.
    location /api/ {
        return 404;
    }

    # Built files carry a content hash in their names, so they never change under the same address.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Every other address is a page of the app: send files that exist, otherwise the app itself.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
