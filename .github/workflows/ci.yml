# Quality gates for every pull request and every push to main. A push to main also publishes the images to GHCR,
# tagged with the commit SHA. Deployment stays manual (docs/operations/deploy.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2

jobs:
  backend:
    name: Backend tests and SBOM
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit and integration tests (Testcontainers uses the runner's Docker).
      - run: ./mvnw -B -ntp verify
      - name: SBOM (CycloneDX, runtime dependencies)
        run: >
          ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom
          -DincludeTestScope=false -DoutputFormat=json -DoutputName=bom
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-backend
          path: backend/target/bom.json
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend checks and SBOM
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Known vulnerabilities in production dependencies (High and Critical)
        run: npm audit --omit=dev --audit-level=high
      - name: SBOM (CycloneDX, production dependencies)
        run: npx --yes @cyclonedx/cyclonedx-npm@7.0.0 --omit dev --output-format JSON --output-file bom.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-frontend
          path: frontend/bom.json

  e2e:
    name: End-to-end (desktop)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # The suite starts its own PostgreSQL, Mailpit and backend (tests/support/global-setup.ts).
      - run: npm run test:e2e -- --project=desktop
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: frontend/test-results

  dependencies:
    name: Dependency vulnerabilities (High and Critical)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
      - name: Scan the SBOMs
        run: |
          for sbom in sbom-backend/bom.json sbom-frontend/bom.json; do
            docker run --rm -v "$PWD:/scan:ro" "$TRIVY_IMAGE" sbom --quiet --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 "/scan/$sbom"
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (whole history)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner /repo

  deploy-config:
    name: Deployment configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compose file
        working-directory: deploy
        run: |
          cp .env.example .env
          cp backend.env.example backend.env
          docker compose --profile monitoring config --quiet
      - name: Caddyfile
        run: >
          docker run --rm -e HOURFORGE_DOMAIN=localhost -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Alert rules and their tests
        run: >
          docker run --rm -v "$PWD/deploy/monitoring:/c:ro" --entrypoint promtool prom/prometheus:v3.16.0
          test rules /c/alerts.test.yml
      - name: Alertmanager example
        run: >
          docker run --rm -v "$PWD/deploy/monitoring:/c:ro" --entrypoint amtool prom/alertmanager:v0.35.0
          check-config /c/alertmanager.yml.example
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

  images:
    name: Images (scan, publish from main)
    needs: [backend, frontend, e2e, dependencies, secrets, deploy-config]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          docker build -t hourforge-backend:ci backend
          docker build -t hourforge-frontend:ci frontend
          docker build -t hourforge-backup:ci deploy/backup
      - name: Scan (High and Critical with a fix block the build)
        run: |
          for image in hourforge-backend:ci hourforge-frontend:ci hourforge-backup:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --quiet \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Publish to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for name in backend frontend backup; do
            docker tag "hourforge-$name:ci" "$registry/hourforge-$name:$GITHUB_SHA"
            docker push "$registry/hourforge-$name:$GITHUB_SHA"
          done
