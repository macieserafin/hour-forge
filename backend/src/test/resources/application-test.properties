spring.datasource.url=${TEST_DATABASE_URL:jdbc:tc:postgresql:18-alpine:///hourforge}
spring.datasource.driver-class-name=${TEST_DATABASE_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
spring.datasource.username=${TEST_DATABASE_USERNAME:hourforge_test}
spring.datasource.password=${TEST_DATABASE_PASSWORD:hourforge_test}
