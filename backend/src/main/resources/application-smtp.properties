# Local testing with a real mail server instead of Mailpit: SPRING_PROFILES_ACTIVE=smtp (docs/development.md).
# The settings and the password come from .env.smtp (repository root or backend/, kept out of Git); its values win over
# the Mailpit ones in .env. Environment variables still win over both, so do not export SPRING_MAIL_* in that shell.
spring.config.import=optional:file:../.env.smtp[.properties],optional:file:./.env.smtp[.properties]

# Without a host, login and password the start fails here instead of falling back to another server.
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
# Always encrypted, whatever MAIL_STARTTLS says; the certificate must match the host (application.properties).
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Only MAIL_ALLOWED_RECIPIENTS receive mail; the rest of the local outbox never reaches this server.
app.mail.require-allowed-recipients=true
