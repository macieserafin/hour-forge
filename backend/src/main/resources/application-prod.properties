# Production profile (SPRING_PROFILES_ACTIVE=prod, set in deploy/compose.yaml). Applied on top of application.properties.
# Safe values are the defaults here, so they do not depend on each deployment remembering to set them.

# The site is served over HTTPS only, so the session cookie is never sent over plain HTTP.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Client addresses (rate limits, sign-in history) come from the proxy's X-Forwarded-For. "native" lets Tomcat trust the
# header only from private addresses (its internal proxies), i.e. from Caddy on the Docker network.
server.forward-headers-strategy=native

# A query running longer than this is cancelled by PostgreSQL.
spring.datasource.hikari.connection-init-sql=SET statement_timeout = ${DB_STATEMENT_TIMEOUT_MS:30000}

# Migrations are a separate deployment step ("java -jar app.jar migrate", the "migrate" service in deploy/compose.yaml)
# run by the account that owns the schema; this account can only read and write rows. Hibernate still checks at start
# that the schema matches the code.
spring.flyway.enabled=false

# One JSON object per log line: no start-up banner.
spring.main.banner-mode=off
