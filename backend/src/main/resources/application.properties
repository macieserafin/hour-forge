spring.application.name=backend
# E-mail is required: set SPRING_MAIL_HOST (and SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD).
# Mapped explicitly so the values also work from the .env file, which is not an environment source.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:HourForge <no-reply@localhost>}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
# With STARTTLS on, a server that does not offer it is refused instead of used in plain text (a network attacker could
# otherwise strip it and read the SMTP password), and the certificate must match the host name. Switch MAIL_STARTTLS
# off only for a local test server such as Mailpit.
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
# Optional, for testing a real mail server locally (profile "smtp"): comma-separated addresses; mail to anybody else
# is refused like an undelivered message. Empty = no limit.
app.mail.allowed-recipients=${MAIL_ALLOWED_RECIPIENTS:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Jira Cloud integration: off unless explicitly enabled. Mapped explicitly so the values also work from the .env file.
app.jira.enabled=${JIRA_INTEGRATION_ENABLED:false}
app.jira.client-id=${JIRA_CLIENT_ID:}
app.jira.client-secret=${JIRA_CLIENT_SECRET:}
app.jira.redirect-uri=${JIRA_REDIRECT_URI:}
app.jira.encryption-key-version=${JIRA_TOKEN_ENCRYPTION_KEY_VERSION:v1}
app.jira.encryption-key=${JIRA_TOKEN_ENCRYPTION_KEY:}
# Sign-in with Google (OpenID Connect): off unless GOOGLE_CLIENT_ID is set, and then GOOGLE_CLIENT_SECRET is required.
# Not mapped to spring.security.oauth2.client.*: the registration is built only when the integration is on.
# GOOGLE_REDIRECT_URI is the callback registered at Google, e.g. http://localhost:5173/api/auth/oauth2/callback/google;
# without it the address of the incoming request is used.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:hourforge}}
spring.datasource.username=${DB_USERNAME:hourforge}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Inactivity limit of a normal session; "Zapamiętaj mnie" extends it for that device (see SecurityConfig).
server.servlet.session.timeout=8h
# Sessions are stored in the database (V27); the schema comes from Flyway, not from Spring Session.
spring.session.jdbc.initialize-schema=never
# Spring Session does not take server.servlet.session.timeout; without this a stored session would end after 30 min.
spring.session.timeout=8h
# Pictures are at most 2 MB (re-encoded to a small JPEG on the server).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Actuator: health, info and Prometheus metrics on a separate port that is never published nor routed by the proxy.
management.server.port=${MANAGEMENT_PORT:9090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Ready = the database answers. A mail server outage does not take the application out (messages wait in the outbox).
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false
# Abuse limits (in-memory, per instance). Override with e.g. APP_RATELIMIT_REGISTRATION_MAX.
# Background jobs and how long expired data is kept.
app.jobs.enabled=${JOBS_ENABLED:true}
app.jobs.unconfirmed-account-age=7d
app.jobs.spent-token-age=7d
app.jobs.stale-invitation-age=90d
app.jobs.long-timer-after=10h
app.jobs.login-history-age=90d
# Unused accounts are removed after this time, with e-mail warnings 30 and 7 days before (GDPR storage limitation).
app.jobs.inactive-account-age=730d
# Optional local IP location database (.mmdb, e.g. DB-IP "IP to City Lite"); without it only shortened addresses are shown.
# The attribution is shown next to the places, as the database licence asks (DB-IP Lite: CC BY 4.0).
app.geoip.database=${GEOIP_DATABASE:}
# Accounts allowed into the instance operator panel (comma-separated, confirmed addresses only).
app.operator.emails=${OPERATOR_EMAILS:}
# Bot protection on registration (Cloudflare Turnstile); off unless both keys are set.
app.bot-check.site-key=${TURNSTILE_SITE_KEY:}
app.bot-check.secret-key=${TURNSTILE_SECRET_KEY:}
# Two-step sign-in (TOTP): authenticator secrets are encrypted with this key (32 random bytes, base64).
# Without a key two-step sign-in cannot be turned on.
app.two-factor.encryption-key=${TWO_FACTOR_ENCRYPTION_KEY:}
app.two-factor.encryption-key-version=${TWO_FACTOR_ENCRYPTION_KEY_VERSION:v1}
app.geoip.attribution=${GEOIP_ATTRIBUTION:IP Geolocation by DB-IP (https://db-ip.com)}

app.rate-limit.login-account-ip.max=5
app.rate-limit.login-account-ip.window=15m
app.rate-limit.login-account-ip.block=15m
app.rate-limit.login-ip.max=30
app.rate-limit.login-ip.window=15m
app.rate-limit.login-ip.block=15m
app.rate-limit.login-account.max=50
app.rate-limit.login-account.window=1h
app.rate-limit.login-account.block=15m
app.rate-limit.two-factor.max=5
app.rate-limit.two-factor.window=15m
app.rate-limit.two-factor.block=15m
app.rate-limit.password-change.max=5
app.rate-limit.password-change.window=15m
app.rate-limit.password-change.block=15m
app.rate-limit.email-verification.max=3
app.rate-limit.email-verification.window=1h
app.rate-limit.email-verification-ip.max=10
app.rate-limit.email-verification-ip.window=1h
app.rate-limit.data-export.max=5
app.rate-limit.data-export.window=1h
# Copies of personal data written at the same time in this instance (each streams with its own database connection).
app.data-export.max-concurrent=2
app.rate-limit.report-export.max=20
app.rate-limit.report-export.window=1h
app.rate-limit.jira-authorize.max=20
app.rate-limit.jira-authorize.window=1h
app.rate-limit.jira-search.max=60
app.rate-limit.jira-search.window=1m
# Starts of a Google sign-in and returns from Google, per client address (each sign-in counts twice).
app.rate-limit.google-sign-in.max=30
app.rate-limit.google-sign-in.window=15m
app.rate-limit.registration.max=5
app.rate-limit.registration.window=1h
app.rate-limit.team-creation.max=10
app.rate-limit.team-creation.window=1h
app.rate-limit.invitation-email.max=20
app.rate-limit.invitation-email.window=1h
app.rate-limit.invitation-creation.max=30
app.rate-limit.invitation-creation.window=1h
app.rate-limit.project-creation.max=30
app.rate-limit.project-creation.window=1h
#---
spring.config.activate.on-profile=!test
# The local .env (repository root or backend/) is read everywhere except in tests: a developer's real keys and OAuth clients
# must not change what the tests check or end up in their reports. (No comment right after "#---": it would not split.)
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
