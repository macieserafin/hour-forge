name: hour-forge

services:
  postgres:
    image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hourforge}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_USERNAME: ${DB_USERNAME:-hourforge}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres-init:
    image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ${DB_NAME:-hourforge}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_USERNAME: ${DB_USERNAME:-hourforge}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - ./docker/postgres/01-create-app-user.sh:/create-app-user.sh:ro
    entrypoint: ["/bin/sh", "/create-app-user.sh"]

  # Development mail server (required by the backend): SMTP on 1025, inbox in the browser on 8025.
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
